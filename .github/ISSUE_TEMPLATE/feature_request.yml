name: Feature request
description: Suggest a scoped OpenRelix improvement without making roadmap commitments.
title: "[Feature]: "
labels:
  - enhancement
body:
  - type: markdown
    attributes:
      value: |
        Please describe the user problem and smallest useful slice. Avoid including private documents, raw transcripts, logs, account data, or proprietary snippets.
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What repeated pain or workflow gap should this solve?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed slice
      description: What is the smallest useful change?
    validations:
      required: true
  - type: textarea
    id: non_goals
    attributes:
      label: Non-goals
      description: What should this request explicitly not cover?
  - type: dropdown
    id: area
    attributes:
      label: Area
      options:
        - installer
        - host collection
        - memory policy
        - overview or panel
        - index or search
        - docs or contributor workflow
        - package or release
        - privacy or connector boundary
        - other
    validations:
      required: true
  - type: textarea
    id: acceptance
    attributes:
      label: Acceptance criteria
      placeholder: |
        - [ ] ...
        - [ ] ...
  - type: textarea
    id: validation
    attributes:
      label: Suggested validation
      description: Commands, fixture shape, or observable behavior that would prove it works.
  - type: checkboxes
    id: privacy
    attributes:
      label: Privacy confirmation
      options:
        - label: I did not include raw host history, state roots, private logs, credentials, account data, or proprietary snippets.
          required: true
