name: Bug report
description: Report a reproducible OpenRelix bug with sanitized details.
title: "[Bug]: "
labels:
  - bug
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting an issue. Please do not upload raw host history, state roots, private logs, screenshots with private content, account data, tokens, cookies, or proprietary snippets.
  - type: input
    id: version
    attributes:
      label: OpenRelix version
      description: Use `openrelix --version` or the package version if available.
      placeholder: "0.3.3"
    validations:
      required: true
  - type: dropdown
    id: install_method
    attributes:
      label: Install method
      options:
        - npx install
        - repo checkout
        - local package
        - other
    validations:
      required: true
  - type: dropdown
    id: platform
    attributes:
      label: Platform
      options:
        - macOS
        - Linux or Windows experimental/manual use
        - other
    validations:
      required: true
  - type: textarea
    id: summary
    attributes:
      label: Summary
      description: What happened?
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Reproduction steps
      description: Use reduced, sanitized steps.
      placeholder: |
        1. Run ...
        2. Open ...
        3. See ...
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual behavior
    validations:
      required: true
  - type: textarea
    id: diagnostics
    attributes:
      label: Sanitized diagnostics
      description: Paste short summaries only. Redact paths, accounts, private project names, and secrets.
      render: text
  - type: checkboxes
    id: privacy
    attributes:
      label: Privacy confirmation
      options:
        - label: I did not include raw host history, state roots, private logs, credentials, account data, or proprietary snippets.
          required: true
