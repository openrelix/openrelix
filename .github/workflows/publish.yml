name: Publish npm

on:
  workflow_dispatch:
  release:
    types: [published]
  push:
    tags:
      - "v*"

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22.14.0"
          registry-url: "https://registry.npmjs.org/"

      - name: Use npm 11
        run: npm install -g npm@11

      - name: Resolve package version
        id: version
        shell: bash
        run: |
          version="$(node -p "require('./package.json').version")"
          if [[ -z "$version" ]]; then
            echo "package.json version is empty" >&2
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Check npm version
        id: npm_version
        shell: bash
        run: |
          if npm view "openrelix@${{ steps.version.outputs.version }}" version --registry https://registry.npmjs.org/ >/dev/null 2>&1; then
            echo "published=true" >> "$GITHUB_OUTPUT"
            echo "openrelix@${{ steps.version.outputs.version }} already exists on npm."
          else
            echo "published=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Block personal-info leaks
        if: steps.npm_version.outputs.published != 'true'
        run: python3 scripts/check_personal_info.py

      - name: Inject analytics client token
        if: steps.npm_version.outputs.published != 'true'
        shell: bash
        env:
          OPENRELIX_ANALYTICS_CLIENT_TOKEN: ${{ secrets.OPENRELIX_ANALYTICS_CLIENT_TOKEN }}
        run: |
          if [[ -z "$OPENRELIX_ANALYTICS_CLIENT_TOKEN" ]]; then
            echo "::error::OPENRELIX_ANALYTICS_CLIENT_TOKEN is required for official npm packages."
            exit 1
          fi
          install -d install/analytics
          printf '%s\n' "$OPENRELIX_ANALYTICS_CLIENT_TOKEN" > install/analytics/OpenRelixAnalyticsToken.txt

      - name: Verify package contents
        if: steps.npm_version.outputs.published != 'true'
        run: npm pack --dry-run --json

      - name: Publish to npm
        if: steps.npm_version.outputs.published != 'true'
        run: npm publish --provenance

      - name: Notify Feishu on npm publish
        if: steps.npm_version.outputs.published != 'true'
        shell: bash
        env:
          FEISHU_WEBHOOK_URL: ${{ secrets.OPENRELIX_FEISHU_RELEASE_WEBHOOK_URL }}
          FEISHU_FALLBACK_WEBHOOK_URL: ${{ secrets.OPENRELIX_FEISHU_BACKMERGE_WEBHOOK_URL }}
          FEISHU_WEBHOOK_SECRET: ${{ secrets.OPENRELIX_FEISHU_RELEASE_SECRET }}
          FEISHU_FALLBACK_WEBHOOK_SECRET: ${{ secrets.OPENRELIX_FEISHU_BACKMERGE_SECRET }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          python3 scripts/notify_feishu.py npm-published \
            --version "${{ steps.version.outputs.version }}" \
            --changelog docs/changelog/v0.x.html \
          || echo "::warning::Feishu npm publish notification failed."
