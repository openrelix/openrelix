name: Bugfix Backmerge

on:
  push:
    branches:
      - "bugfix/version_*"

permissions:
  contents: write

concurrency:
  group: bugfix-backmerge-${{ github.ref_name }}
  cancel-in-progress: false

jobs:
  validate-and-backmerge:
    runs-on: ubuntu-latest
    if: startsWith(github.ref_name, 'bugfix/version_')
    steps:
      - name: Checkout bugfix branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          registry-url: "https://registry.npmjs.org/"

      - name: Prepare merge to main
        shell: bash
        run: |
          bugfix_branch="${GITHUB_REF_NAME}"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch --no-tags origin \
            "refs/heads/main:refs/remotes/origin/main" \
            "refs/heads/${bugfix_branch}:refs/remotes/origin/${bugfix_branch}"
          git checkout -B main refs/remotes/origin/main
          git merge --no-ff --no-edit "refs/remotes/origin/${bugfix_branch}"

      - name: Block personal-info leaks
        run: python3 scripts/check_personal_info.py

      - name: Git diff --check merged changes
        run: git diff --check refs/remotes/origin/main...HEAD

      - name: Compile Python sources
        run: python3 -m py_compile scripts/*.py install/*.py

      - name: Run unit tests
        run: python3 -m unittest discover -s tests

      - name: Validate npm package contents
        run: |
          npm pack --dry-run --json > /tmp/npm-pack.json
          python3 - <<'PY'
          import json
          import sys
          from pathlib import Path

          data = json.loads(Path("/tmp/npm-pack.json").read_text(encoding="utf-8"))
          if not data:
              sys.exit("npm pack --dry-run produced no manifest")
          manifest = data[0]
          files = {entry["path"] for entry in manifest.get("files", [])}

          required = {
              "AGENTS.md",
              "CLAUDE.md",
              "CODE_OF_CONDUCT.md",
              "CONTRIBUTING.md",
              "LICENSE",
              "README.md",
              "README.zh-CN.md",
              "SECURITY.md",
              "package.json",
          }
          missing = sorted(required - files)
          if missing:
              sys.exit("npm pack missing required files: " + ", ".join(missing))

          forbidden_prefixes = (
              ".agents/skills/openrelix-",
              "tests/",
              ".github/",
          )
          forbidden = sorted(
              path for path in files
              if any(path.startswith(prefix) for prefix in forbidden_prefixes)
          )
          if forbidden:
              sys.exit(
                  "npm pack includes files that should not ship: "
                  + ", ".join(forbidden)
              )

          print("npm pack OK ({} files, {} bytes)".format(
              len(files), manifest.get("size", 0)
          ))
          PY

      - name: Push merged main
        shell: bash
        run: |
          git push origin HEAD:main
