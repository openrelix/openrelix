name: Bugfix Backmerge

on:
  push:
    branches:
      - "bugfix/version_*"

permissions:
  contents: write

env:
  TZ: Asia/Shanghai

concurrency:
  group: bugfix-backmerge-${{ github.ref_name }}
  cancel-in-progress: false

jobs:
  validate-and-backmerge:
    runs-on: macos-latest
    if: startsWith(github.ref_name, 'bugfix/version_')
    steps:
      - name: Checkout bugfix branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          registry-url: "https://registry.npmjs.org/"

      - name: Prepare merge to main
        shell: bash
        run: |
          bugfix_branch="${GITHUB_REF_NAME}"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch --no-tags origin \
            "refs/heads/main:refs/remotes/origin/main" \
            "refs/heads/${bugfix_branch}:refs/remotes/origin/${bugfix_branch}"
          git checkout -B main refs/remotes/origin/main
          git merge --no-ff --no-edit "refs/remotes/origin/${bugfix_branch}"

      - name: Block personal-info leaks
        run: python3 scripts/check_personal_info.py

      - name: Git diff --check merged changes
        run: git diff --check refs/remotes/origin/main...HEAD

      - name: Compile Python sources
        run: python3 -m py_compile scripts/*.py install/*.py

      - name: Run unit tests
        run: python3 -m unittest discover -s tests

      - name: Validate npm package contents
        run: |
          npm pack --dry-run --json > /tmp/npm-pack.json
          python3 - <<'PY'
          import json
          import sys
          from pathlib import Path

          data = json.loads(Path("/tmp/npm-pack.json").read_text(encoding="utf-8"))
          if not data:
              sys.exit("npm pack --dry-run produced no manifest")
          manifest = data[0]
          files = {entry["path"] for entry in manifest.get("files", [])}

          required = {
              "AGENTS.md",
              "CLAUDE.md",
              "CODE_OF_CONDUCT.md",
              "CONTRIBUTING.md",
              "LICENSE",
              "README.md",
              "README.zh-CN.md",
              "SECURITY.md",
              "package.json",
          }
          missing = sorted(required - files)
          if missing:
              sys.exit("npm pack missing required files: " + ", ".join(missing))

          forbidden_prefixes = (
              ".agents/skills/openrelix-",
              "tests/",
              ".github/",
          )
          forbidden = sorted(
              path for path in files
              if any(path.startswith(prefix) for prefix in forbidden_prefixes)
          )
          if forbidden:
              sys.exit(
                  "npm pack includes files that should not ship: "
                  + ", ".join(forbidden)
              )

          print("npm pack OK ({} files, {} bytes)".format(
              len(files), manifest.get("size", 0)
          ))
          PY

      - name: Push merged main
        shell: bash
        run: |
          git push origin HEAD:main

      - name: Notify Feishu on backmerge failure
        if: failure()
        shell: bash
        env:
          FEISHU_WEBHOOK_URL: ${{ secrets.OPENRELIX_FEISHU_BACKMERGE_WEBHOOK_URL }}
          FEISHU_WEBHOOK_SECRET: ${{ secrets.OPENRELIX_FEISHU_BACKMERGE_SECRET }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          COMMIT_URL: ${{ github.server_url }}/${{ github.repository }}/commit/${{ github.sha }}
        run: |
          if [[ -z "${FEISHU_WEBHOOK_URL}" ]]; then
            echo "OPENRELIX_FEISHU_BACKMERGE_WEBHOOK_URL is not configured; skip Feishu notification."
            exit 0
          fi
          python3 - <<'PY' > /tmp/openrelix-feishu-backmerge.json
          import base64
          import hashlib
          import hmac
          import json
          import os
          import time

          branch = os.environ.get("GITHUB_REF_NAME", "")
          repo = os.environ.get("GITHUB_REPOSITORY", "")
          sha = os.environ.get("GITHUB_SHA", "")
          run_url = os.environ.get("RUN_URL", "")
          commit_url = os.environ.get("COMMIT_URL", "")
          message = "\n".join(
              [
                  "OpenRelix bugfix 回合 main 失败",
                  "仓库：{}".format(repo),
                  "分支：{}".format(branch),
                  "提交：{}".format(sha[:7] or "unknown"),
                  "结果：未推送 main",
                  "处理：把最新 origin/main 合入 bugfix 分支，解决冲突或检查失败后重新 push。",
                  "Actions：{}".format(run_url),
                  "Commit：{}".format(commit_url),
              ]
          )
          payload = {
              "msg_type": "text",
              "content": {"text": message},
          }
          secret = os.environ.get("FEISHU_WEBHOOK_SECRET", "")
          if secret:
              timestamp = str(int(time.time()))
              string_to_sign = "{}\n{}".format(timestamp, secret)
              digest = hmac.new(
                  string_to_sign.encode("utf-8"),
                  b"",
                  digestmod=hashlib.sha256,
              ).digest()
              payload["timestamp"] = timestamp
              payload["sign"] = base64.b64encode(digest).decode("utf-8")
          print(json.dumps(payload, ensure_ascii=False))
          PY
          curl --fail --silent --show-error \
            -X POST \
            -H "Content-Type: application/json" \
            --data @/tmp/openrelix-feishu-backmerge.json \
            "${FEISHU_WEBHOOK_URL}"
