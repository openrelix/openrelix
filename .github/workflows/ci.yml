name: CI

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          registry-url: "https://registry.npmjs.org/"

      - name: Block personal-info leaks
        run: python3 scripts/check_personal_info.py

      - name: Git diff --check
        run: git diff --check HEAD

      - name: Compile Python sources
        run: python3 -m py_compile scripts/*.py install/*.py

      - name: Run unit tests
        run: python3 -m unittest discover -s tests

      - name: Validate npm package contents
        run: |
          npm pack --dry-run --json > /tmp/npm-pack.json
          python3 - <<'PY'
          import json
          import sys
          from pathlib import Path

          data = json.loads(Path("/tmp/npm-pack.json").read_text(encoding="utf-8"))
          if not data:
              sys.exit("npm pack --dry-run produced no manifest")
          manifest = data[0]
          files = {entry["path"] for entry in manifest.get("files", [])}

          required = {
              "AGENTS.md",
              "CLAUDE.md",
              "CODE_OF_CONDUCT.md",
              "CONTRIBUTING.md",
              "LICENSE",
              "README.md",
              "README.zh-CN.md",
              "SECURITY.md",
              "package.json",
          }
          missing = sorted(required - files)
          if missing:
              sys.exit("npm pack missing required files: " + ", ".join(missing))

          forbidden_prefixes = (
              ".agents/skills/openrelix-",
              "tests/",
              ".github/",
          )
          forbidden = sorted(
              path for path in files
              if any(path.startswith(prefix) for prefix in forbidden_prefixes)
          )
          if forbidden:
              sys.exit(
                  "npm pack includes files that should not ship: "
                  + ", ".join(forbidden)
              )

          print("npm pack OK ({} files, {} bytes)".format(
              len(files), manifest.get("size", 0)
          ))
          PY
